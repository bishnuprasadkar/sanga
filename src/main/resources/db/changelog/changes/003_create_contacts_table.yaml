databaseChangeLog:
  - changeSet:
      id: 003-create-contacts-table
      author: bishnu

      changes:
        - createTable:
            tableName: contacts
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_contacts
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: contact_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: contacts
            baseColumnNames: owner_id
            constraintName: fk_contact_owner
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: contacts
            baseColumnNames: contact_id
            constraintName: fk_contact_contact
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT

        - addUniqueConstraint:
            tableName: contacts
            columnNames: owner_id, contact_id
            constraintName: uk_contact_owner_contact

        - createIndex:
            tableName: contacts
            indexName: idx_contact_owner
            columns:
              - column:
                  name: owner_id

        - createIndex:
            tableName: contacts
            indexName: idx_contact_contact
            columns:
              - column:
                  name: contact_id