databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: bishnu

      changes:

        - createTable:
            tableName: users
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: display_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: profile_picture
                  type: VARCHAR(500)

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: online_status
                  type: VARCHAR(20)
                  defaultValue: OFFLINE
                  constraints:
                    nullable: false

              - column:
                  name: last_seen
                  type: TIMESTAMPTZ

        - createIndex:
            tableName: users
            indexName: uk_user_username_lower
            unique: true
            columns:
              - column:
                  name: lower(username)
                  computed: true
