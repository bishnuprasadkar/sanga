databaseChangeLog:
  - changeSet:
      id: 005-create-conversation-participants-table
      author: bishnu
      changes:
        - createTable:
            tableName: conversation_participants
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_conversation_participants
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: conversation_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  defaultValue: MEMBER
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: conversation_participants
            baseColumnNames: conversation_id
            constraintName: fk_participant_conversation
            referencedTableName: conversations
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: conversation_participants
            baseColumnNames: user_id
            constraintName: fk_participant_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - addUniqueConstraint:
            tableName: conversation_participants
            columnNames: conversation_id, user_id
            constraintName: uk_conversation_user
        - createIndex:
            tableName: conversation_participants
            indexName: idx_participant_conversation
            columns:
              - column:
                  name: conversation_id
        - createIndex:
            tableName: conversation_participants
            indexName: idx_participant_user
            columns:
              - column:
                  name: user_id
